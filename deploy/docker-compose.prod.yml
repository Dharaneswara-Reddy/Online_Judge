# CodeArena production stack — one EC2 host, no managed AWS services.
#
# Rollout is always a pull and a restart:
#
#   docker compose -f deploy/docker-compose.prod.yml pull
#   docker compose -f deploy/docker-compose.prod.yml up -d --no-build
#
# There is deliberately no `build:` stanza in this file. Building here
# exhausts the 916 MB host — it has taken the site down twice, once badly
# enough that sshd could no longer fork. Images are built by GitHub
# Actions and published to GHCR; see deploy/README.md.
#
# Secrets come from deploy/.env on the host, which is git-ignored and
# never committed. MongoDB stays on Atlas.
#
# Only the frontend publishes a port. RabbitMQ, Redis and the API are
# reachable only on the internal compose network, so nothing but 80 is
# exposed to the internet.
#
# ---------------------------------------------------------------------
# Memory budget
# ---------------------------------------------------------------------
# Every service below carries a hard `mem_limit`, and `memswap_limit` is
# set equal to it so a container can never push the host into swap it
# does not have.
#
# Two host sizes are supported. Set MAX_SANDBOXES in deploy/.env to match
# the host you are on — it is the one setting that must change, and
# getting it wrong is how this stack has been OOM-killed before.
#
#   t3.micro   1 GiB, ~916 MB usable   MAX_SANDBOXES=1
#   t4g.small  2 GiB, ~1833 MB usable  MAX_SANDBOXES=2   (arm64/Graviton2)
#
# The arithmetic for t4g.small, which is what production targets:
#
#     1833 MB   usable RAM (2048 MiB less the ~10.5% the kernel and
#               firmware reserve, the same ratio the t3.micro shows)
#   -  250 MB   host: kernel, systemd, sshd, dockerd, SSM agent
#   -  768 MB   TWO judge sandboxes at their 384 MB ceiling
#   ---------
#   =  815 MB   for the compose services below
#
#      256 MB   rabbitmq   Measured at 100 MB idle on the existing host,
#                           but the health probe runs rabbitmq-diagnostics,
#                           which starts a SECOND Erlang VM inside the same
#                           cgroup. At 160 MB that probe was OOM-killed on
#                           every run (exit 137), so the container never
#                           became healthy and everything depending on it
#                           refused to start. The broker itself was fine —
#                           the limit has to cover the broker plus its own
#                           diagnostics, not just the broker.
#      144 MB   api
#      112 MB   worker
#       56 MB   redis      (maxmemory 40mb, so redis evicts before it OOMs)
#       40 MB   frontend   (nginx serving static files)
#   ---------
#      608 MB   committed, leaving ~207 MB (11%) genuinely spare.
#
# Idle usage measured on the existing production host for comparison:
# frontend 5.7 MB, api 8.0 MB, worker 7.4 MB, rabbitmq 100 MB, redis
# 6.4 MB — 127 MB in total. The limits above are deliberately well above
# that, because idle is not the number that matters: a Go heap under load
# and a Mongo connection pool both grow, and a limit that only fits idle
# is a limit that kills the process the moment it is used.
#
# That spare margin is the point of the migration. The old host ran at a
# 12 MB margin with one sandbox; this one runs at ~300 MB with two.
#
# The 384 MB figure is playground.MaxMemoryLimitMB, and the two numbers
# are load-bearing together: MAX_SANDBOXES x MaxMemoryLimitMB is what the
# host must survive. At the previous 512 MB ceiling, two sandboxes would
# leave 47 MB — a 3% margin, which is the knife-edge that took the 1 GiB
# instance down twice. Raise either number only by redoing this sum.
#
# CAVEAT — judge sandboxes are NOT compose services. The worker creates
# them directly through the host Docker daemon, so they are siblings of
# this stack and compose cannot cap them. MAX_SANDBOXES is a hard
# semaphore around container creation inside the worker, shared by all
# three of its consumers, so no lane count or prefetch setting can exceed
# it. The worker logs the real ceiling at startup — read it there.
#
# CPU — and why MAX_SANDBOXES stops at 2 on a 2 vCPU host:
# Each sandbox is created with NanoCPUs 1.0, so two of them is exactly
# the machine. A third would mean sandboxes sharing cores, and because
# the time limit is enforced on wall-clock, a program needing one second
# of CPU would take longer than a second of wall-clock and could be
# failed for exceeding a limit it never actually exceeded. Concurrency is
# capped by vCPU count for verdict fairness, not by spare RAM.
#
# t4g.small is burstable: 20% baseline (0.4 vCPU sustained) earning 24
# CPU credits per hour, against the t3.micro's 10% and 6 credits. That is
# four times the sustained judging capacity, and roughly 290-480
# submissions per hour before credits are touched. Sustained two-core
# judging still drains the balance in a few hours, so watch
# CPUCreditBalance if load ever becomes continuous rather than bursty.

x-logging: &default-logging
  # Unbounded json-file logs fill the 8 GB root volume. A full disk trips
  # RabbitMQ's disk-free alarm, which blocks every publisher, and recovery
  # needs an SSH session, which also needs disk. Worst case here is
  # 5 services x 30 MB = 150 MB.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    # Built by CI and pulled from the registry. Never built on the host.
    image: ${CLIENT_IMAGE:-ghcr.io/dharaneswara-reddy/codearena-client:latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt material, read-only. nginx's master process starts as
      # root and reads the key once at startup, so the private key keeps
      # its 600 root-only permissions on the host — the container is given
      # no way to modify any of it.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Shared ACME webroot. Renewal writes the challenge file here from
      # the host and nginx serves it from the same directory, which is what
      # lets certbot renew without stopping the container. The first
      # certificate had to use the standalone plugin because the dotfile
      # rule answered the challenge path with 404.
      - /var/www/certbot:/var/www/certbot:ro
    mem_limit: 40m
    memswap_limit: 40m
    cpus: 0.20
    stop_grace_period: 20s
    logging: *default-logging
    # nginx keeps its worker process alive while wedged, so `restart:
    # unless-stopped` alone never notices. Serving the SPA shell is the
    # honest proxy for "this container is still useful".
    healthcheck:
      # Checks TLS on the loopback. Certificate verification is skipped
      # deliberately: the certificate is issued for the public hostname,
      # not for 127.0.0.1, and this probe is asking whether nginx is
      # serving — not whether the certificate chains. Hitting port 80
      # instead would only ever exercise the redirect, and following it
      # would send a health check out to the public internet and back.
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - api

  api:
    image: ${SERVER_IMAGE:-ghcr.io/dharaneswara-reddy/codearena-server:latest}
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      DB_NAME: ${DB_NAME:-online_judge}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8080"
      CLIENT_URL: ${CLIENT_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      # Plain HTTP for now, so a Secure cookie would be dropped by the
      # browser. Set to true the moment TLS terminates in front of this.
      SECURE_COOKIES: "false"
    expose:
      - "8080"
    mem_limit: 144m
    memswap_limit: 144m
    cpus: 0.60
    stop_grace_period: 30s
    logging: *default-logging
    # Liveness, not readiness. Compose restarts an unhealthy container, and
    # restarting the API does nothing about an unreachable Atlas — it just
    # removes the process that could still serve cached and static routes.
    # So this asks only whether the process is serving HTTP.
    #
    # It replaces a probe that hit /api/problems, which ran a Mongo query
    # every thirty seconds forever. GET /readyz is the endpoint that does
    # consult dependencies; it is for an operator or a future load
    # balancer, deliberately not for the restart policy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Same image as the API — one binary set, different entrypoint.
    image: ${SERVER_IMAGE:-ghcr.io/dharaneswara-reddy/codearena-server:latest}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/worker"]
    # The worker launches judge sandboxes through the host's Docker
    # daemon. The socket is mounted read-write because creating a
    # container requires it — but the daemon is never exposed over TCP,
    # and only this container can reach the socket.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MONGO_URI: ${MONGO_URI}
      DB_NAME: ${DB_NAME:-online_judge}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      # Queue prefetch: how many deliveries each lane takes at once.
      # This is NOT the container count — see MAX_SANDBOXES below.
      WORKER_COUNT: ${WORKER_COUNT:-2}
      # The ceiling the memory budget at the top of this file is built
      # on. One sandbox at 256 MB is what the 916 MB host has room for
      # once the services above are accounted for. Raising this without
      # redoing that arithmetic re-opens the out-of-memory failure that
      # took the site down twice.
      MAX_SANDBOXES: ${MAX_SANDBOXES:-1}
    mem_limit: 112m
    memswap_limit: 112m
    cpus: 0.40
    # Shutdown has to finish judging the job in flight and then remove the
    # sandbox container it created. That path can take ~15s, and the
    # default 10s SIGKILL cuts it off mid-execution, orphaning a container
    # that still holds memory nothing will reclaim. 45s covers it with
    # room for a slow `docker rm` on a loaded host.
    stop_grace_period: 45s
    logging: *default-logging
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      # No RABBITMQ_VM_MEMORY_HIGH_WATERMARK here. RabbitMQ 4 treats that
      # variable as deprecated and refuses to boot when it is set — it
      # exits 1 on every start, which is a crash loop, not a warning.
      #
      # It is also unnecessary. The watermark defaults to 0.6 relative,
      # and RabbitMQ reads the cgroup limit rather than host memory, so
      # the effective ceiling is already 0.6 of the mem_limit below
      # (~96 MB). That is exactly the intent: block publishers and page
      # out queues on its own terms rather than being OOM-killed by the
      # kernel, because a blocked publisher recovers and a killed broker
      # loses its channels.
    # No ports published: reachable only inside the compose network.
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.35
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory sits below the cgroup limit on purpose: redis evicting a
    # rate-limit key is a degraded rate limiter, whereas redis being
    # OOM-killed takes War Room fan-out down with it.
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "32mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    expose:
      - "6379"
    mem_limit: 56m
    memswap_limit: 56m
    cpus: 0.15
    stop_grace_period: 10s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq-data:
