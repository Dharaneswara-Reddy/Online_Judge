# CodeArena production stack — one EC2 host, no managed AWS services.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Secrets come from deploy/.env on the host, which is git-ignored and
# never committed. MongoDB stays on Atlas.
#
# Only the frontend publishes a port. RabbitMQ, Redis and the API are
# reachable only on the internal compose network, so nothing but 80 is
# exposed to the internet.

services:
  frontend:
    build:
      context: ../client
      args:
        # Same-origin: nginx proxies /api to the API container, so the
        # bundle never needs a cross-origin host baked in.
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      DB_NAME: ${DB_NAME:-online_judge}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8080"
      CLIENT_URL: ${CLIENT_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      # Plain HTTP for now, so a Secure cookie would be dropped by the
      # browser. Set to true the moment TLS terminates in front of this.
      SECURE_COOKIES: "false"
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../server
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/worker"]
    # The worker launches judge sandboxes through the host's Docker
    # daemon. The socket is mounted read-write because creating a
    # container requires it — but the daemon is never exposed over TCP,
    # and only this container can reach the socket.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MONGO_URI: ${MONGO_URI}
      DB_NAME: ${DB_NAME:-online_judge}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      # One t3.micro core; more slots would only cause contention.
      WORKER_COUNT: ${WORKER_COUNT:-2}
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # No ports published: reachable only inside the compose network.
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq-data:
