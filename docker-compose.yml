# Local development infrastructure for the Online Judge.
#
# MongoDB is not included on purpose — the project uses MongoDB Atlas,
# as required by the coding constitution.
#
#   docker compose up -d      start RabbitMQ and Redis
#   docker compose down       stop them (data is discarded)
#
# RabbitMQ's management UI is at http://localhost:15672 (guest/guest).
#
# Both services bind to 127.0.0.1 on purpose: Docker's published ports
# bypass host firewalls, so a bare "5672:5672" would expose the broker
# to the whole network.

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: oj-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"   # AMQP — the API and judge workers connect here
      - "127.0.0.1:15672:15672" # management UI, handy for watching queue depth
    environment:
      # Local development credentials only. A deployment supplies its own
      # through RABBITMQ_USER / RABBITMQ_PASSWORD and never uses these.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: oj-redis
    ports:
      - "127.0.0.1:6379:6379"
    # Cache and ephemeral War Room state only — nothing here needs to
    # survive a restart, so persistence stays off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
