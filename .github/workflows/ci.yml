# Continuous integration — runs on every push and pull request.
#
# This needs no secrets and touches no infrastructure, so it is safe to
# run on untrusted pull requests. Deployment lives in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest

    services:
      # Integration tests need a real MongoDB. A service container is used
      # rather than the Atlas cluster so CI never holds a production
      # database credential, and so concurrent runs cannot collide in a
      # shared test database — which has already caused a false failure.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Unit tests carry the race detector. They use in-memory fakes, so
      # they are fast and need nothing external.
      - name: Unit tests (race)
        run: go test ./internal/... -race -count=1

      # Integration tests talk to the service container above.
      - name: Integration tests
        env:
          MONGO_URI: mongodb://localhost:27017
          DB_NAME: online_judge_test
          JWT_SECRET: ci-test-secret-not-used-in-production
          CLIENT_URL: http://localhost:5173
        run: go test ./tests/... -count=1

  client:
    name: Client (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
