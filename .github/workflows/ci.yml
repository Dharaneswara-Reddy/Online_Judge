# Continuous integration — runs on every push and pull request.
#
# This needs no secrets and touches no infrastructure, so it is safe to
# run on untrusted pull requests. Deployment lives in release.yml.
#
# Third-party actions are pinned to full commit SHAs, with the version in
# a trailing comment. A tag like @v4 is a mutable pointer the action's
# owner can move at any time, so it is not a version — it is a promise.
# release.yml in particular runs with a token that can write to GHCR, and
# a moved tag there means arbitrary new code holding it. Nothing in this
# repository enforces SHA pinning, so it is a convention this comment has
# to carry. The trailing comment is what keeps them upgradable: Dependabot
# and Renovate both read it, and so does a human.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, stated rather than inherited. With no permissions block
# a workflow gets the repository's default token scope, which is a setting
# in the GitHub UI: it reads `read` today, but nothing in the repository
# records that, and flipping it back to "read and write" would silently
# hand every job here — including ones running code from a fork's pull
# request — a token that can push commits, move tags and write packages.
# Declaring it here means that setting can no longer change what CI can
# do. release.yml already does the same. Any job needing more asks for it
# at the job level, where the extra scope is visible next to the reason.
permissions:
  contents: read

# A newer push makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest

    services:
      # Integration tests need a real MongoDB. A service container is used
      # rather than the Atlas cluster so CI never holds a production
      # database credential, and so concurrent runs cannot collide in a
      # shared test database — which has already caused a false failure.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # The broker recovery tests used to skip silently here: with no
      # broker reachable they called t.Skipf and Go still exited 0, so
      # seven tests covering "submissions survive a broker restart" never
      # ran and nothing said so. They now fail rather than skip whenever
      # CI is set, which makes this container load-bearing.
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 60s

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Unit tests carry the race detector. They use in-memory fakes, so
      # they are fast and need nothing external.
      - name: Unit tests (race)
        run: go test ./internal/... -race -count=1

      # Integration tests talk to the service containers above.
      #
      # These carry -race too, and they are the ones that need it most:
      # the unit tests run in-memory and sequentially, while these drive
      # real concurrent writes against MongoDB and a real broker. The
      # race detector was previously on the tests least likely to reveal
      # a race and off the ones most likely to.
      - name: Integration tests (race)
        env:
          MONGO_URI: mongodb://localhost:27017
          DB_NAME: online_judge_test
          JWT_SECRET: ci-test-secret-not-used-in-production
          CLIENT_URL: http://localhost:5173
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          # Belt and braces: the suite already fails rather than skips
          # when CI is set, but naming it here makes the intent explicit.
          RABBITMQ_REQUIRED: "1"
        run: go test ./tests/... -count=1 -race
        timeout-minutes: 30

  sandbox:
    name: Judge sandbox (containment)
    runs-on: ubuntu-latest

    # These are the tests that assert the containment boundary holds:
    # no network, the PID and memory caps, the wall-clock kill, and that
    # orphaned containers are reclaimed. They sit behind a build tag —
    # the only one in the tree — and CI never passed it, so they had
    # never once run here. A commit weakening the sandbox shipped green.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # The tests drive the real Docker daemon on the runner and need the
      # judge image present under the exact tag the sandbox looks for.
      - name: Build the judge sandbox image
        run: docker build -t codearena-sandbox:latest docker/judge-sandbox

      - name: Containment tests
        working-directory: server
        run: go test ./internal/judge/... -tags integration -count=1 -v
        timeout-minutes: 20

      # A leaked container after the suite means the cleanup path itself
      # is broken, which is the failure that took the production host
      # down. Cheap to assert, so assert it.
      - name: No sandbox containers may be left behind
        run: |
          leaked=$(docker ps -aq --filter "label=codearena.sandbox=judge")
          if [ -n "$leaked" ]; then
            echo "These sandbox containers outlived the test run:"
            docker ps -a --filter "label=codearena.sandbox=judge"
            exit 1
          fi
          echo "No leaked sandbox containers."

  sandbox-arm64:
    name: Judge sandbox (containment, arm64)
    # Native arm64, not emulation. Production is moving to a t4g.small
    # (Graviton2), and the containment tests are timing-sensitive: they
    # assert compile and run budgets, so they cannot be verified under
    # QEMU. Measured locally, a cold Go compile inside the sandbox takes
    # about 76 seconds emulated against a 15 second compileTimeout — a
    # failure caused entirely by the emulator. These runners are free for
    # public repositories and execute on real ARM hardware, so the result
    # here means something.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Confirm the runner really is arm64
        run: |
          arch=$(uname -m)
          echo "runner architecture: $arch"
          if [ "$arch" != "aarch64" ]; then
            echo "expected aarch64 — this job is pointless on anything else"
            exit 1
          fi

      - name: Build the judge sandbox image (arm64)
        run: docker build -t codearena-sandbox:latest docker/judge-sandbox

      - name: Containment tests
        working-directory: server
        run: go test ./internal/judge/... -tags integration -count=1 -v
        timeout-minutes: 25

      - name: No sandbox containers may be left behind
        if: always()
        run: |
          leaked=$(docker ps -aq --filter "label=codearena.sandbox=judge")
          if [ -n "$leaked" ]; then
            echo "These sandbox containers outlived the test run:"
            docker ps -a --filter "label=codearena.sandbox=judge"
            docker rm -f $leaked
            exit 1
          fi
          echo "No leaked sandbox containers."

  scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    # Advisory for now: this is the first scanning the project has ever
    # had, so a hard failure would block every change on a backlog nobody
    # has triaged yet. Read the summary, fix what it finds, then drop the
    # continue-on-error lines to make it enforcing.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # govulncheck reports only vulnerabilities that are actually
      # reachable from this code, so its output is worth reading rather
      # than a list of every advisory touching the dependency tree.
      - name: Go modules (govulncheck)
        working-directory: server
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: npm audit
        working-directory: client
        continue-on-error: true
        run: npm audit --audit-level=high

  client:
    name: Client (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 22, not 20. jsdom pulls in an undici that calls
      # webidl.util.markAsUncloneable, which does not exist on Node 20, so
      # the whole vitest run dies before a single test executes. 22 also
      # matches the version used for local development.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
