# Builds the production images and publishes them to GHCR.
#
# This exists because building on the production host does not work. The
# instance is a t3.micro with 916 MB of RAM, and compiling the Go
# binaries and the Monaco-heavy frontend bundle there exhausted its
# memory badly enough to take the site down. A hosted runner has an order
# of magnitude more memory, so the host only ever has to pull a finished
# image and restart a container — seconds instead of twenty minutes.
#
# Publishing an image changes nothing on the server by itself. Rolling it
# out is a separate, deliberate step: see deploy/README.md.
#
# Three images are published: the server (API + worker), the client, and
# the judge sandbox that untrusted submissions execute inside.
#
# ---------------------------------------------------------------------
# Why workflow_run, and not a job inside ci.yml
# ---------------------------------------------------------------------
# This workflow used to trigger on `push: main` independently of CI, with
# no `needs:` between them. The two raced, so a commit whose tests failed
# still got tagged `:latest` — the exact tag deploy/README.md tells the
# operator to pull. There are two ways to close that.
#
#   (a) Move the build into ci.yml as a job with `needs: [server, client]`.
#       Simplest and least error-prone: the gate is an ordering edge that
#       cannot be misconfigured, and `github.sha` is already the right
#       commit. The cost is that ci.yml runs on pull requests from forks,
#       and it would then contain a job holding `packages: write`. Job
#       permissions and an `if:` guard do contain that, but the property
#       ci.yml's own header claims — "needs no secrets, touches no
#       infrastructure, safe on untrusted pull requests" — would stop
#       being true by inspection and start depending on two guards being
#       right.
#
#   (b) workflow_run, which is what this does. The publishing token stays
#       in a workflow that untrusted code can never trigger, and
#       workflow_dispatch keeps working as a separate trigger for a
#       deliberate manual release. The cost is that workflow_run has real
#       footguns, handled explicitly below: it does not check out the
#       commit that was tested, and it fires for pull-request CI runs too.
#
# (b) was chosen because the security boundary is worth more than the
# simplicity, and its footguns are fixable in one place, once.
#
# Third-party actions are pinned to full commit SHAs, with the version in
# a trailing comment. A tag like @v4 is a mutable pointer the action's
# owner can move at any time, so it is not a version — it is a promise.
# release.yml in particular runs with a token that can write to GHCR, and
# a moved tag there means arbitrary new code holding it. Nothing in this
# repository enforces SHA pinning, so it is a convention this comment has
# to carry. The trailing comment is what keeps them upgradable: Dependabot
# and Renovate both read it, and so does a human.
name: Release images

on:
  workflow_run:
    workflows: ["CI"]   # matches the `name:` in ci.yml
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed on the commit being released, not the ref, so two releases of
  # the same commit collapse but two different commits do not cancel each
  # other mid-push and leave a half-published pair.
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    # The gate. All four conditions matter:
    #
    #  - conclusion == 'success'      CI actually passed. workflow_run
    #                                 fires on failure and cancellation
    #                                 too; without this the trigger change
    #                                 would achieve nothing.
    #  - event == 'push'              CI also runs on pull_request, and a
    #                                 workflow_run fires for those runs as
    #                                 well.
    #  - head_repository == this repo `branches: [main]` filters on the
    #                                 head branch NAME, so a fork whose own
    #                                 default branch is called `main` slips
    #                                 through it. Without this line, opening
    #                                 a pull request from such a fork would
    #                                 build and publish the fork's code to
    #                                 our registry.
    #  - workflow_dispatch            manual release, where none of the
    #                                 workflow_run fields exist at all.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    # GHCR is used rather than ECR so no new AWS infrastructure and no
    # long-lived AWS credential is involved; the token below is issued
    # for this run only.
    permissions:
      contents: read
      packages: write

    strategy:
      # Kept false, but for a different reason than before. It used to be
      # actively harmful: each leg pushed :latest itself, so a failed
      # client build with a successful server build left :latest pointing
      # at a server image with no matching frontend — a mismatched pair
      # that the next `docker compose pull` would happily deploy. Now no
      # leg touches :latest at all (see the promote job below), so a
      # partial failure can only leave orphan SHA tags that nothing
      # references. With that fixed, running every leg to completion is
      # the better behaviour: one run tells you all three results instead
      # of only the first to break.
      fail-fast: false
      matrix:
        include:
          - name: server
            context: server
          - name: client
            context: client
          # The judge sandbox. It used to be built by hand on the host and
          # existed in no registry, so a `docker system prune` — the
          # obvious response to a full disk — deleted it and every
          # submission failed afterwards, with no way back that did not
          # involve apt-installing a JDK and build-essential on a 916 MB
          # instance. It is a production artefact like the other two and is
          # now published like them.
          - name: sandbox
            context: docker/judge-sandbox

    steps:
      # workflow_run does NOT check out the commit that was tested. Both
      # `github.sha` and checkout's default ref point at the tip of the
      # default branch at trigger time, which is already a different commit
      # whenever two pushes land close together — the classic way a
      # "gated" release publishes code that was never tested. Resolve the
      # tested SHA once here and use it for the checkout and the tag.
      - name: Resolve the commit CI tested
        id: rel
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.rel.outputs.sha }}

      # QEMU lets an amd64 runner emulate arm64. It is genuinely slow —
      # apt-installing a JDK and build-essential under emulation takes
      # tens of minutes for the sandbox image — but a release runs only on
      # a merge to main, and correctness matters more than minutes here.
      #
      # The faster alternative is a per-architecture matrix on native
      # runners (ubuntu-24.04-arm is free for public repositories) pushing
      # by digest, with a manifest-merge job afterwards. That is a much
      # larger change to a workflow that cannot be tested before it runs
      # on main, so it is deliberately left as a follow-up rather than
      # bundled into the migration.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repository owners can contain capitals; image references cannot.
      - name: Normalise image name
        id: image
        run: echo "ref=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/codearena-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          # Both architectures, published as one manifest list per tag.
          #
          # arm64 is what production moves to: the instance becomes a
          # t4g.small (AWS Graviton2), which has twice the memory of the
          # t3.micro it replaces and is free until 2026-12-31. amd64 is
          # kept rather than dropped, because it is the rollback path —
          # the old x86 instance can still pull the same tag and run — and
          # because contributors on x86 laptops pull these images too.
          #
          # A manifest list means neither the compose file nor the deploy
          # docs need an architecture in them: the daemon picks the right
          # image for the host it is on.
          platforms: linux/amd64,linux/arm64
          # ONLY the immutable SHA tag. :latest is moved by the promote
          # job once every image for this commit exists, so the three
          # halves of a deployment can never be published out of step.
          # The SHA is the one from the gate above, not github.sha, which
          # under workflow_run is a different commit.
          tags: ${{ steps.image.outputs.ref }}:${{ steps.rel.outputs.sha }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Atomic promotion of :latest
  # ---------------------------------------------------------------------
  # deploy/README.md tells the operator to pull :latest, and compose
  # defaults to it, so :latest is the pointer that decides what production
  # runs. The three images are one deployment: the frontend bundle talks
  # to a specific API shape, and the worker starts containers from a
  # specific sandbox image. Publishing them independently means a failed
  # leg can leave production one pull away from a mismatched set.
  #
  # `needs: build` makes this run only when all three legs succeeded, and
  # imagetools retags manifests in the registry rather than pulling and
  # re-pushing layers, so the three moves take seconds and land close
  # together. GHCR has no multi-tag transaction, so this is as close to
  # atomic as the registry allows — the remaining window is a few seconds
  # between three retags, versus the previous failure mode of a mismatch
  # that persists until someone notices.
  promote:
    name: Point :latest at this build
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve the commit CI tested
        id: rel
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      # QEMU lets an amd64 runner emulate arm64. It is genuinely slow —
      # apt-installing a JDK and build-essential under emulation takes
      # tens of minutes for the sandbox image — but a release runs only on
      # a merge to main, and correctness matters more than minutes here.
      #
      # The faster alternative is a per-architecture matrix on native
      # runners (ubuntu-24.04-arm is free for public repositories) pushing
      # by digest, with a manifest-merge job afterwards. That is a much
      # larger change to a workflow that cannot be tested before it runs
      # on main, so it is deliberately left as a follow-up rather than
      # bundled into the migration.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move :latest
        env:
          SHA: ${{ steps.rel.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for image in server client sandbox; do
            ref="${REGISTRY}/${owner}/codearena-${image}"
            echo "::group::${ref}:latest -> ${SHA}"
            docker buildx imagetools create --tag "${ref}:latest" "${ref}:${SHA}"
            echo "::endgroup::"
          done
