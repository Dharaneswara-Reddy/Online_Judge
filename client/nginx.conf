server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Monaco ships as a large local chunk; make sure it is served with a
    # long cache lifetime rather than refetched on every visit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API. The browser never talks to :8080 directly, so the
    # API port stays closed to the internet.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # War Room live updates need the upgrade handshake preserved.
    location /ws/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Single-page app: unknown paths fall through to the bundle.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
