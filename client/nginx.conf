server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cap request bodies. nginx's default is 1m, which was governing by
    # accident rather than by decision; submissions carry source code, and
    # the Go side already refuses oversized bodies via its own middleware.
    # This is the outer of the two limits, so it should be at least as
    # large as the server's or nginx would reject bodies the API would
    # have accepted, with a 413 the SPA does not explain.
    client_max_body_size 2m;

    # ---- Security headers ----
    #
    # These are repeated in every location that has an add_header of its
    # own. nginx does NOT merge add_header across levels: a location that
    # declares one discards every add_header inherited from the server
    # block. Deleting a copy below silently drops the whole set for that
    # location, so keep them in sync.
    #
    # The API and WebSocket locations deliberately have none, because the
    # Go process sets its own on those responses and two conflicting
    # X-Frame-Options headers are worse than one.
    #
    # No Strict-Transport-Security here on purpose: this server listens on
    # plain HTTP, and an HSTS header sent over HTTP either gets ignored or,
    # once a browser has seen it over HTTPS, pins the host to HTTPS for a
    # year. TODO: add
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # the moment TLS is terminated in front of this, and not before.

    # Monaco ships as a large local chunk; make sure it is served with a
    # long cache lifetime rather than refetched on every visit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # Static bundle: it is never framed and never sniffed. The full
        # policy lives on the document response below; what matters here
        # is that a .js chunk is not reinterpreted as something else.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Docker's embedded DNS. nginx resolves an upstream name once at
    # startup unless the address comes from a variable, so recreating the
    # api container gave it a new IP that nginx never learned about and
    # every request 502'd until the frontend was restarted by hand.
    # Resolving per request keeps a redeploy of the API invisible here.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API. The browser never talks to :8080 directly, so the
    # API port stays closed to the internet.
    location /api/ {
        # $request_uri is required: naming the upstream through a variable
        # stops nginx passing the matched path along on its own.
        set $api_backend http://api:8080;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for. The latter appends
        # to the header the client sent, so a caller could prepend any
        # address it liked and the API would read that as the client IP —
        # which is exactly how the per-address rate limits on login and
        # registration were bypassed. Replacing means the API only ever
        # sees an address nginx observed on the socket itself. There is no
        # proxy in front of nginx to preserve a chain for; if one is ever
        # added, this must become a chain that is trimmed at that hop, not
        # a blind append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # War Room live updates need the upgrade handshake preserved.
    location /ws/ {
        set $ws_backend http://api:8080;
        proxy_pass $ws_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Same reasoning as /api/: nginx passes unknown client headers
        # upstream untouched, so these have to be overwritten here too or
        # a socket client could still dictate its own address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Single-page app: unknown paths fall through to the bundle.
    # A dotfile probe gets a 404, not the SPA shell. Without this the
    # fallback below answered /.env with 200 and an HTML body, which reads
    # to a scanner as "there is something here".
    location ~ /\. {
        return 404;
    }

    location / {
        # An /api path that reaches here did not match the proxy above, so
        # it is a genuine 404 — returning index.html told an API client it
        # had succeeded and handed it HTML to parse. Deep links like
        # /problems/two-sum still fall through to the SPA as before.
        location /api {
            return 404;
        }

        try_files $uri $uri/ /index.html;

        # Content-Security-Policy, tuned to exactly what this app does.
        # Each non-obvious entry earns its place:
        #
        #   script-src 'self' 'wasm-unsafe-eval'
        #       No inline scripts — Vite emits a module tag with a src.
        #       'wasm-unsafe-eval' allows WebAssembly instantiation
        #       without allowing eval() of JavaScript; some Monaco builds
        #       need it and it is the narrow form of the exemption.
        #   worker-src 'self' blob:
        #       Monaco starts its language services in web workers, which
        #       bundlers commonly hand it as a blob: URL. Without blob:
        #       the editor silently loses syntax services.
        #   style-src ... 'unsafe-inline' https://fonts.googleapis.com
        #       Monaco injects its themes as <style> elements at runtime,
        #       so inline styles cannot be forbidden here without
        #       breaking the editor. The Google Fonts host is needed for
        #       the @import at the top of src/index.css.
        #   font-src https://fonts.gstatic.com
        #       Where that stylesheet then fetches the font files from.
        #   connect-src 'self' ws: wss:
        #       XHR to /api and the War Room socket at /ws are same
        #       origin. 'self' covers ws:// of the same origin only in
        #       CSP3 browsers, so the schemes are listed explicitly
        #       rather than having the live race break on older ones.
        #   frame-ancestors 'none'
        #       The clickjacking fix. X-Frame-Options below says the same
        #       thing for anything that does not implement CSP3.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; manifest-src 'self'; connect-src 'self' ws: wss:" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
